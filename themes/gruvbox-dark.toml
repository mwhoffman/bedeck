# The gruvbox (dark) theme: its colors, and the roles they're used for.

[colors]
# The 16 ANSI colors in order. gruvbox uses its background, text and greys for
# black and white.
black = "bg0"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "fg3"
bright_black = "fg4"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "fg0"

# Accents: colors the theme has beyond the ANSI ones. gruvbox's is orange.
accent1 = "#d65d0e"
bright_accent1 = "#fe8019"

# The background (bg0), and four steps from it towards the text. bg_hard is a
# darker background (gruvbox's hard contrast one).
bg_hard = "#1d2021"
bg0 = "#282828"
bg1 = "#3c3836"
bg2 = "#504945"
bg3 = "#665c54"
bg4 = "#7c6f64"

# The text (fg0), and four steps from it towards the background. fg_hard is a
# brighter text.
fg_hard = "#fbf1c7"
fg0 = "#ebdbb2"
fg1 = "#d5c4a1"
fg2 = "#bdae93"
fg3 = "#a89984"
fg4 = "#928374"

# What the colors are used for. Each role is one of the colors above.

# The general interface.
[roles.ui]
background = "black"
panel = "bg1"
text = "fg0"
text_dim = "fg3"
highlight = "yellow"
bright_highlight = "bright_yellow"
alert = "red"
cursor = "fg4"
# Selected text, e.g. the terminal's selection or nvim's visual mode: the
# background behind it, as the text keeps its own colors.
region = "bg3"
# The background of the current item in a list or menu, e.g. zsh's completions,
# fzf's current line or tmux's pickers. Its text is the normal text.
menu_selected = "bg2"

# Window-like things: the multiplexer's bar and tabs, and pane borders. The
# accent is the blocks at either end of the bar.
[roles.chrome]
accent = "blue"
accent_text = "black"
bar = "bg1"
tab_active = "fg3"
tab_active_text = "bg0"
tab_inactive = "bg2"
tab_inactive_text = "fg3"
border = "bg3"
border_active = "fg3"

# The desktop shell: its bar, workspaces, window borders, menus, dialogs and
# notifications. Muted is its secondary text (e.g. the bar's clock), and urgent
# is for lines and text while urgent_fill is for filled backgrounds.
[roles.desktop]
background = "bg_hard"
focused = "blue"
inactive = "bg2"
muted = "bright_black"
urgent = "bright_red"
urgent_fill = "red"

# Search matches, and the current one, as the background of the text color.
[roles.search]
match = "bright_yellow"
current = "bright_accent1"
text = "black"

# Kinds of file.
[roles.file]
plain = "bright_white"
script = "bright_white"
directory = "blue"
symlink = "bright_cyan"
executable = "bright_green"
special = "bright_red"
archive = "bright_red"
media = "bright_magenta"
document = "bright_magenta"
compiled = "yellow"
temp = "bright_black"

# The permissions in a file listing: what each letter is colored by.
[roles.permissions]
read = "yellow"
write = "red"
execute = "green"
special = "magenta"

# Version control.
[roles.git]
added = "bright_green"
modified = "yellow"
deleted = "bright_red"
untracked = "red"
ahead = "green"
behind = "magenta"
branch = "bright_cyan"

# The backgrounds of the lines of a diff: each is a color mixed into the
# background, so that text stays readable on it.
[roles.diff]
added = {mix = "green", into = "bg0", amount = 0.4}
changed = {mix = "cyan", into = "bg0", amount = 0.4}
deleted = {mix = "red", into = "bg0", amount = 0.4}

# Problems an editor reports in code.
[roles.diagnostics]
error = "bright_red"
warning = "bright_yellow"
info = "bright_blue"
hint = "bright_cyan"
ok = "bright_green"

# Messages printed in the terminal, e.g. while completing.
[roles.messages]
descriptions = "green"
messages = "magenta"
warnings = "red"

# The parts of code, e.g. as a shell highlights a command line.
[roles.syntax]
command = "bright_green"
builtin = "bright_accent1"
keyword = "bright_red"
error = "bright_red"
string = "bright_green"
variable = "bright_blue"
operator = "bright_accent1"
comment = "bright_black"

# A fuzzy finder's list (e.g. fzf's): matches, the prompt and marked items, its
# info and borders. Its current line is ui.menu_selected.
[roles.picker]
match = "bright_accent1"
prompt = "bright_red"
marker = "bright_green"
info = "bright_black"
border = "fg1"
separator = "bg2"
gutter = "bg1"
