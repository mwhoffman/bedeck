# Icons, and their colors, for directories, file names and extensions.
#
# Each entry is NAME = [ICON, COLOR] or NAME = ICON, where ICON is a Nerd Font
# glyph name (e.g. "oct-gear") or a single character (e.g. "\u2371"), and COLOR
# is one of the palette's colors or of [extra-colors]. An entry with no color
# gets its section's default one: default.dir's for [dir], and default.file's
# for the others.
#
# The sections are [dir], [file], [ext] and [filetype] (an nvim filetype), and
# [default], which has the icons for files with an extension nothing knows
# (file), files with no extension (noext) and directories (dir). eza's theme
# can't change these, so eza keeps its built-in ones, which the file and noext
# defaults match.

# Colors the icons use that a palette may not have: the palette's color is used
# if it has one of the same name.
[extra-colors]
vim_green = "#019833"
azure = "#3d9df3"
sky = "#00add8"
violet = "#a78bfa"

[default]
file = ["fa-file", "fg0"]
noext = ["md-file_question", "fg0"]
dir = ["md-folder", "blue"]

