# gruvbox's (dark) palette.

[colors]
# The 16 ANSI colors in order. gruvbox uses its background, text and greys for
# black and white.
black = "base"
red = "#cc241d"
green = "#98971a"
yellow = "#d79921"
blue = "#458588"
magenta = "#b16286"
cyan = "#689d6a"
white = "overlay2"
bright_black = "overlay1"
bright_red = "#fb4934"
bright_green = "#b8bb26"
bright_yellow = "#fabd2f"
bright_blue = "#83a598"
bright_magenta = "#d3869b"
bright_cyan = "#8ec07c"
bright_white = "text"

# Accents: colors the palette has beyond the ANSI ones. gruvbox's is orange.
accent1 = "#d65d0e"
bright_accent1 = "#fe8019"

# A darker background than base, for secondary panes (gruvbox's hard contrast
# background).
mantle = "#1d2021"

# The background, and four steps from it towards the text.
base = "#282828"
surface0 = "#3c3836"
surface1 = "#504945"
surface2 = "#665c54"
overlay0 = "#7c6f64"

# The text, and four steps from it towards the background.
text = "#ebdbb2"
subtext1 = "#d5c4a1"
subtext0 = "#bdae93"
overlay2 = "#a89984"
overlay1 = "#928374"

# Emphasized text (unused for now).
bright_text = "#fbf1c7"
